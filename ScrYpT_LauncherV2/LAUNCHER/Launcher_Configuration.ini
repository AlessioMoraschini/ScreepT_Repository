#------------------------------------------------------
#----------------  IMPOSTAZIONI JVM  ------------------
#------------------------------------------------------

[JVM_OPTIONS]
stackSizeArgs = 100
# stack memory size in mb
memoryArgs = -Xmx768m -Xms348m
# Max and min memory for heap
maxJvmVersion = 12.0.0
# MAX EXCLUDED - Used for blocking check - over this application wont start
maxJvmVersionFullCompatibility = 1.9.0
# Max excluded - Used for non blocking checks with warning only
minJvmVersion = 1.8.0
# MIN INCLUDED
preferredJvm = C:\Program Files\AdoptOpenJDK\jdk-8.0.232.09-hotspot
# user preference
manualPathJvm = 
# this will contain manual selected when user selects one from missing dependencies panel
preferredJvmVersionIfNotSpecified = 1.8

#------------------------------------------------------
#-----------   IMPOSTAZIONI ScreepT   ------------------
#------------------------------------------------------
[APPLICATION_OPTIONS]
jarToLaunch = ScreepT_0.7.6.jar
autoShowInstallOpt = true
flagHideNStartDirect = false
logLevelSetting = ERROR
viewCmdConsole = false
scaleGuiPerc = 1

