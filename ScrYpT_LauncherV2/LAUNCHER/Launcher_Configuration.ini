#------------------------------------------------------
#----------------  IMPOSTAZIONI JVM  ------------------
#------------------------------------------------------

[JVM_OPTIONS]
stackSizeArgs = 125
# stack memory size in mb
memoryArgs = -Xmx512m -Xms256m
# Max and min memory for heap
maxJvmVersion = 12.0.0
# MAX EXCLUDED
minJvmVersion = 1.8.0
# MIN INCLUDED
preferredJvm = C:\Program Files\java/jdk-11.0.2
# user preference
preferredJvmVersionIfNotSpecified = 1.8

#------------------------------------------------------
#-----------   IMPOSTAZIONI ScrYpT   ------------------
#------------------------------------------------------
[APPLICATION_OPTIONS]
jarToLaunch = ScrYpT_0.7.6.jar
autoShowInstallOpt = true
flagHideNStartDirect = false
logLevelSetting = DEBUG
viewCmdConsole = true
scaleGuiPerc = 1

