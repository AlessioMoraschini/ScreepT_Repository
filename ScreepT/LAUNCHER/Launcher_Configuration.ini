#------------------------------------------------------
#----------------  IMPOSTAZIONI JVM  ------------------
#------------------------------------------------------

[JVM_OPTIONS]
stackSizeArgs = 8
# stack memory size in mb
memoryArgs = -Xmx378m -Xms378m
# Max and min memory for heap - Dont add other to this cause it's splitted with string scheme
maxJvmVersion = 12.0.0
# MAX EXCLUDED - Used for blocking check - over this value application wont start
maxJvmVersionFullCompatibility = 12.0.0
# Max excluded - Used for non blocking checks with warning only when over this value
minJvmVersion = 1.8.0
# MIN INCLUDED - Used for blocking check - under this value application wont start
preferredJvm = 
# user preference
manualPathJvm = 
# this will contain manual selected when user selects one from missing dependencies panel
preferredJvmVersionIfNotSpecified = 1.8

#------------------------------------------------------
#-----------   IMPOSTAZIONI ScreepT   ------------------
#------------------------------------------------------
[APPLICATION_OPTIONS]
jarToLaunch = ScreepT_${project.version}.jar
autoShowInstallOpt = true
flagHideNStartDirect = false
logLevelSetting = ERROR
viewCmdConsole = false
scaleGuiPerc = 1

