#--------------------------------------------------------------------------------------------------
#-------------------------------------    AES SETTINGS     ------------------------------------
#--------------------------------------------------------------------------------------------------

[AES_OPTIONS]
flagCodificaAes = false

#--------------------------------------------------------------------------------------------------
#------------------------------------   SCREEPT  SETTINGS    ---------------------------------------
#--------------------------------------------------------------------------------------------------
[STEGANO_OPTIONS]
# flag steg attivo e modalità
flagCodificaSteg = false
# Steg mode active by default if true
flagUltraSecure = false
# Ultra secure mode active by default if true
defaultWidth = 1293
# Default keygen image width
defaultHeight = 1831
# Default keygen image Height
imgKeyRecentPath = C:UsersxxDesktopalessioVOID.png,C:Users/xx/Desktop, C:Users/xx

#--------------------------------------------------------------------------------------------------
#------------------------------------   FILE  SETTINGS   ---------------------------------------
#--------------------------------------------------------------------------------------------------
[FILE_OPTIONS]
flagAutosave = false
# Flag for current config autosave
autosaveInterval = 600000
# Autosave time between saves (in milliseconds)
flagOverwrite = false
# Not yet managed: Flag to remember if user prefers overwrite in secondary actions like import into dictionary or loading configuration
lastSrcFolder = C:\Users\xx\Desktop
# Last source folder used (path to last file system of execution)
lastDstFolder = C:\Users\xx\Desktop\LogProvaExport(2).log

#--------------------------------------------------------------------------------------------------
#------------------------------------   GENERIC SETTINGS  ---------------------------------------
#--------------------------------------------------------------------------------------------------
[GENERIC_OPTIONS]
userName = Alessio
# Username
charset = UTF-8
# Preferred charset
generalVolume = 0.16

#--------------------------------------------------------------------------------------------------
#------------------------------------    GUI  SETTINGS    ---------------------------------------
#--------------------------------------------------------------------------------------------------
[GUI_OPTIONS]
preferredStyle = javax.swing.plaf.nimbus.NimbusLookAndFeel
# Preferred graphics style
darkGuiNimbus = false
# Dark mode graphics
menuFontSize = 19
# Menu Bar font size
logFontSize = 16

#--------------------------------------------------------------------------------------------------
#----------------------------------  TXT EDITOR SETTINGS   -------------------------------------
#--------------------------------------------------------------------------------------------------
[TEXT_EDITOR]
margin = 12
# Preferred text margin
backgroundCol = 0-0-0
# Preferred background color
foregroundCol = 250-250-250
# Preferred foreground color
font = Segoe UI-0-21
# Preferred font
voiceRate = 105
# Default text speaker rate (speed)
loadedFilesAtStart = C:\Users\xx\Desktop\BBBBBBBBB.txt
# List of loaded files at last close
selectedFileAtStart = C:\Users\xx\Desktop\BBBBBBBBB.txt

#--------------------------------------------------------------------------------------------------
#--------------------------------  IMAGE CONVERTER SETTINGS  ----------------------------------
#--------------------------------------------------------------------------------------------------
[IMAGE_CONVERTER]
sameSize = true
# Size out = Size In  (width, heigth)
sameExtension = true
# Extension in = Extension out
quality = 100
# USED ONLY FOR LOSSY - Quality for conversion [0 = Max compression :: 100 = No compression]
algorithm = REPLICATE

