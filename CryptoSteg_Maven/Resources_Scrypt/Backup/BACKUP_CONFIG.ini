#--------------------------------------------------------------------------------------------------
#-------------------------------------    IMPOSTAZIONI AES     ------------------------------------
#--------------------------------------------------------------------------------------------------

[AES_OPTIONS]
flagCodificaAes = true

#--------------------------------------------------------------------------------------------------
#------------------------------------   IMPOSTAZIONI STEG   ---------------------------------------
#--------------------------------------------------------------------------------------------------
[STEGANO_OPTIONS]
flagCodificaSteg = false
flagUltraSecure = true

# keyGen preferenze di altezza/larghezza generazione img
defaultWidth = 1000
defaultHeight = 1000
# questa variabile contiene un elenco dei percorsi recenti a cui sono state salvate le immagini - lista ordinata in ordine di data/preferenza
imgKeyRecentPath = 

#--------------------------------------------------------------------------------------------------
#------------------------------------   IMPOSTAZIONI FILE   ---------------------------------------
#--------------------------------------------------------------------------------------------------
[FILE_OPTIONS]
flagAutosave = false
# flag per autosalvataggio dell'ini come preferenza
autosaveInterval = 600000
# this is the invertal between one autosave and the next (first after this-value-X-milliseconds)
flagOverwrite = false
# flag per "ricordare la scelta dell'utente" quando spunta l'opzione effettuando un operazione che crea o modifica dei file
lastSrcFolder = INI_FILES
# cartella recente di destinazione da cui prelevare i risultati
lastDstFolder = \..

#--------------------------------------------------------------------------------------------------
#------------------------------------ IMPOSTAZIONI GENERALI ---------------------------------------
#--------------------------------------------------------------------------------------------------
[GENERIC_OPTIONS]
#Username
userName = 
#questi due flag servono per memorizzare se effettuare compressione completa o escluderne una parte

charset = UTF-8
# charset usato per conversione String <-> file

#--------------------------------------------------------------------------------------------------
#------------------------------------    IMPOSTAZIONI GUI   ---------------------------------------
#--------------------------------------------------------------------------------------------------
[GUI_OPTIONS]
preferredStyle = javax.swing.plaf.nimbus.NimbusLookAndFeel
# stile della GUI preferito
menuFontSize = 17
#dimensione font del menù
logFontSize = 14
#dimensione font dei log
darkGuiNimbus = false

[TEXT_EDITOR]

