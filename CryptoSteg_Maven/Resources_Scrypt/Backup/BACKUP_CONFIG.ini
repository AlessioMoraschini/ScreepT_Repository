#--------------------------------------------------------------------------------------------------
#-------------------------------------    AES SETTINGS     ------------------------------------
#--------------------------------------------------------------------------------------------------

[AES_OPTIONS]
flagCodificaAes = true

#--------------------------------------------------------------------------------------------------
#------------------------------------   SCREEPT  SETTINGS    ---------------------------------------
#--------------------------------------------------------------------------------------------------
[STEGANO_OPTIONS]
# flag steg attivo e modalità
flagCodificaSteg = true
# Steg mode active by default if true
flagUltraSecure = true
# Ultra secure mode active by default if true
defaultWidth = 3866
# Default keygen image width
defaultHeight = 2333
# Default keygen image Height
imgKeyRecentPath = IMG

#--------------------------------------------------------------------------------------------------
#------------------------------------   FILE  SETTINGS   ---------------------------------------
#--------------------------------------------------------------------------------------------------
[FILE_OPTIONS]
flagAutosave = true
# Flag for current config autosave
autosaveInterval = 600000
# Autosave time between saves (in milliseconds)
flagOverwrite = false
# Not yet managed: Flag to remember if user prefers overwrite in secondary actions like import into dictionary or loading configuration
lastSrcFolder = 
# keeps memory of last opened folder, used as default in file chooser
lastDstFolder = 

#--------------------------------------------------------------------------------------------------
#------------------------------------   GENERIC SETTINGS  ---------------------------------------
#--------------------------------------------------------------------------------------------------
[GENERIC_OPTIONS]
userName = Alessio
# Username
charset = UTF8
# Preferred charset
generalVolume = 0.5
# general volume used by scrypt sound events
lastPanelOpened = gUI.panels.TextEditor
# keeps memory of panel to load at start
txtEditorFileMonitorActive = true
exceptionAdvicesEnabled = true

#--------------------------------------------------------------------------------------------------
#------------------------------------    GUI  SETTINGS    ---------------------------------------
#--------------------------------------------------------------------------------------------------
[GUI_OPTIONS]
# Preferred graphics style
preferredStyle = javax.swing.plaf.nimbus.NimbusLookAndFeel
# Dark mode graphics
darkGuiNimbus = true
# Menu Bar font size
nimbusSize = 0
# a number from 0 to 2 that specifies the size for graphicals elements in case of nimbus LAF
menuFontSize = 18
logFontSize = 14

#--------------------------------------------------------------------------------------------------
#----------------------------------  TXT EDITOR SETTINGS   -------------------------------------
#--------------------------------------------------------------------------------------------------
[TEXT_EDITOR]
inlineTabs = false
# if true all tabs will be on one line, else the will appear overlapped
margin = 0
# Preferred text margin
preferredTheme = 
#preferred color scheme
backgroundCol = 34-49-52
# Preferred background color (Red-Green-Blue)
foregroundCol = 255-204-204
# Preferred foreground color (Red-Green-Blue)
font = DejaVu Sans Mono-0-20
# Preferred font
voiceRate = 104
# Default text speaker rate (speed)
lastEscapeLanguage = HTML_4
# preferred width for right panel on texteditor when it's opened
dividerRightPanePosX = 137
# keeps memory of last language used in escape code specials tool
dividerFileTreePosX = 383
# preferred width for left panel on texteditor when it's opened
fileTreeActive = true
# indicates if file tree view in text editor is visibile or not
clipboardViewActive = false
# indicates if clipboard view on right panel in text editor is visibile or not
mapViewActive = true
# indicates if map view on right panel in text editor is visibile or not
isTreeLocked = false
# when this is true file tree won't be refreshed
defaultWorspaceLocation = C:\Users\xx/
# this is the location of the in stored workspace reference
workspaceViewSelected = false
# when this is true file tree will be refreshed from workspace, and that always be the root
defaultAutoSyntaxSync = false
# automatically select right snytax style according to file extension
filePanelBackgroundCol = 28-32-32
# this is the color used by file tree panel as background (Red-Green-Blue)
loadedFilesAtStart = 
# List of loaded files at last close
selectedFileAtStart = 
# this is the default file preloaded at start
#
#
#-- TEXT AREA OPTIONS --
antialiasedTxtArea = true
# ANTIALIASING
breakLineActive = false
#BREAKLINES
tabLineVisibleFlag = true
# SHOW TAB LINES
tabSize = 2
# TAB SIZE
tabSpacesEmulated = false
# Use n spaces instead of tabs
hyperLinksEnabled = true
# CLICKABLE LINK WITH CTRL PRESSED
markEndOfLine = false
# show a simbol at every end of line
codeFoldingEnabled = false
# FOLDING ON/OFF
autoIndentEnabled = false
# AUTOMATIC CODE INDENTATION
markOccurrences = false
# MARK OCCURRENCES
paintMarkOccurrencesBorder = true
# OCCURRENCES BORDER PAINTED
closeMarkupTags = false
closeCurlyBraces = false
# AUTO CLOSE CODE BLOCKS
bracketMatchingEnabled = false
animateBracketMatching = true
showBracketsPopup = true
# BRACKETS OPTIONS
fadeCurrentLineHighlight = true
useFocusableTips = true
roundedSelectionEdges = true
clearWhitespaceLinesEnabled = true
# Auto clear lines when only whitespaces
highlightSecondaryLanguages = true
# hisglight 2ND language on/off
fractionalFontMetricsEnabled = true
dividerRightPanePosXClipboard = 421
lastFileOpenedClipboard = ClipboardToDo.txt
spellChecker = false
prefDictspellChecker = Resources_Scrypt/SpellChecker/english_dic.zip
lastOpenedFiles = 
clipboardSyncStyle = false
lastSelectedWorkspaces = 

#--------------------------------------------------------------------------------------------------
#--------------------------------  IMAGE CONVERTER SETTINGS  ----------------------------------
#--------------------------------------------------------------------------------------------------
[IMAGE_CONVERTER]
sameSize = true
# Size out = Size In  (width, heigth)
sameExtension = true
# Extension in = Extension out
quality = 100
# USED ONLY FOR LOSSY - Quality for conversion [0 = Max compression :: 100 = No compression]
algorithm = REPLICATE

