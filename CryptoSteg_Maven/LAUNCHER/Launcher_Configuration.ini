#------------------------------------------------------
#----------------  IMPOSTAZIONI JVM  ------------------
#------------------------------------------------------

[JVM_OPTIONS]
stackSizeArgs = 125
# stack memory size in mb
memoryArgs = -Xmx512m -Xms256m
# Max and min memory for heap - Dont add other to this cause it's pliited as string scheme
maxJvmVersion = 12.0.0
# MAX EXCLUDED - Used for blocking check - over this application wont start

maxJvmVersionFullCompatibility = 1.9.0
# Max excluded - Used for non blocking checks with warning only
minJvmVersion = 1.8.0
# MIN INCLUDED

preferredJvm = C:\Program Files\java/jdk-11.0.2
# user preference

manualPathJvm = 
# this will contain manual selected when user selects one from missing dependencies panel

preferredJvmVersionIfNotSpecified = 1.8

#------------------------------------------------------
#-----------   IMPOSTAZIONI ScrYpT   ------------------
#------------------------------------------------------
[APPLICATION_OPTIONS]
jarToLaunch = ScrYpT_${project.version}.jar
autoShowInstallOpt = true
flagHideNStartDirect = false
logLevelSetting = INFO
viewCmdConsole = true
scaleGuiPerc = 1

