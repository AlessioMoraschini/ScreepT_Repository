#------------------------------------------------------
#----------------  IMPOSTAZIONI JVM  ------------------
#------------------------------------------------------

[JVM_OPTIONS]
stackSizeArgs = 125
# stack memory size in mb
memoryArgs = -Xmx268m -Xms168m
# MAX EXCLUDED
maxJvmVersion = 9.0.0
# MIN INCLUDED
minJvmVersion = 1.8.0

#------------------------------------------------------
#-----------   IMPOSTAZIONI ScrYpT   ------------------
#------------------------------------------------------
[APPLICATION_OPTIONS]
jarToLaunch = ScrYpT_${project.version}.jar
autoShowInstallOpt = true
flagHideNStartDirect = false
logLevelSetting = DEBUG
viewCmdConsole = true
scaleGuiPerc = 1

