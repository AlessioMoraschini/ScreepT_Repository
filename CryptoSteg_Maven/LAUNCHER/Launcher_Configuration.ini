[JVM_OPTIONS]
stackSizeArgs = 125
# stack memory size in mb
memoryArgs = -Xmx1026m -Xms514m
# MAX EXCLUDED
maxJvmVersion = 9.0.0
# MIN INCLUDED
minJvmVersion = 1.6.45

#------------------------------------------------------
#-----------   IMPOSTAZIONI ScrYpT   ------------------
#------------------------------------------------------
[APPLICATION_OPTIONS]
jarToLaunch = SCreepT_V0.3.1.X.jar
autoShowInstallOpt = true
flagHideNStartDirect = false
logLevelSetting = ALL

